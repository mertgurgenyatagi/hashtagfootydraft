<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>#footydraft — 20 lobby layouts</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Oswald:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ---- tokens, lifted from src/styles/index.css ---- */
      :root {
        --ground: #101613;
        --surface: #182019;
        --line: #2a342c;
        --ink: #ecefe8;
        --muted: #93a599;
        --accent: #d9a54a;
        --accent-ink: #1b1204;
        --live: #6cc397;
        --disp: 'Oswald', 'Arial Narrow', Impact, sans-serif;
        --sans: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; cursor: default; }
      body {
        background: #0a0d0b; color: var(--ink); font-family: var(--sans);
        -webkit-font-smoothing: antialiased; padding: 40px 24px 120px;
      }

      /* ---- gallery chrome ---- */
      .gal-head { max-width: 1352px; margin: 0 auto 36px; }
      .gal-head h1 { font-family: var(--disp); font-size: 34px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
      .gal-head h1 em { color: var(--accent); font-style: normal; }
      .gal-head p { color: var(--muted); font-size: 13.5px; margin-top: 8px; max-width: 70ch; line-height: 1.6; }
      .gal { max-width: 1352px; margin: 0 auto; display: grid; gap: 32px; grid-template-columns: repeat(auto-fill, minmax(640px, 1fr)); }
      .card { --s: .5; }
      .card.zoom { --s: 1; grid-column: 1 / -1; }
      .scaler { width: calc(1280px * var(--s)); height: calc(800px * var(--s)); overflow: hidden; border: 1px solid #263029; cursor: zoom-in; }
      .card.zoom .scaler { cursor: zoom-out; }
      .cap { margin-top: 10px; display: flex; gap: 10px; align-items: baseline; }
      .cap b { font-family: var(--disp); font-size: 12px; letter-spacing: .18em; color: var(--accent); font-weight: 500; }
      .cap strong { font-family: var(--disp); font-size: 15px; letter-spacing: .06em; text-transform: uppercase; font-weight: 500; }
      .cap span { color: var(--muted); font-size: 12.5px; line-height: 1.5; }

      /* ---- the frame every mockup lives in ---- */
      .frame {
        width: 1280px; height: 800px; background: var(--ground); color: var(--ink);
        position: relative; overflow: hidden; font-size: 14px;
        transform: scale(var(--s)); transform-origin: top left;
      }

      /* ---- shared atoms ---- */
      .d { font-family: var(--disp); text-transform: uppercase; letter-spacing: .09em; font-weight: 500; }
      .lbl { font-family: var(--disp); text-transform: uppercase; letter-spacing: .2em; font-size: 10px; color: var(--muted); font-weight: 500; }
      .panel { background: var(--surface); border: 1px solid var(--line); }
      .num { font-family: var(--disp); font-variant-numeric: tabular-nums; }
      .row { display: flex; align-items: center; gap: 10px; }
      .col { display: flex; flex-direction: column; }
      .sp { justify-content: space-between; }
      .mut { color: var(--muted); }

      .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 999px; font-family: var(--disp); text-transform: uppercase; letter-spacing: .09em; font-weight: 500; padding: 13px 30px; font-size: 13px; border: 1px solid transparent; white-space: nowrap; background: transparent; color: inherit; }
      .btn.p { background: var(--accent); color: var(--accent-ink); }
      .btn.g { border-color: var(--line); color: var(--ink); }
      .btn.sm { padding: 8px 16px; font-size: 11px; }

      .av { width: 38px; height: 38px; border-radius: 999px; display: grid; place-items: center; font-family: var(--disp); font-size: 14px; font-weight: 600; background: #232d25; color: var(--ink); border: 1px solid var(--line); flex: none; }
      .av.h { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
      .av.b { color: var(--muted); border-style: dashed; }
      .av.e { color: #3d4a41; border-style: dashed; background: transparent; }

      .tag { font-family: var(--disp); font-size: 9px; letter-spacing: .16em; text-transform: uppercase; padding: 3px 7px; border: 1px solid var(--line); color: var(--muted); border-radius: 3px; white-space: nowrap; }
      .tag.gold { color: var(--accent); border-color: rgb(217 165 74 / .45); }
      .tag.live { color: var(--live); border-color: rgb(108 195 151 / .4); }

      .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
      .seg > span { padding: 9px 16px; font-family: var(--disp); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
      .seg > span.on { background: var(--accent); color: var(--accent-ink); }

      .code { font-family: var(--disp); letter-spacing: .3em; font-variant-numeric: tabular-nums; }
      .hr { height: 1px; background: var(--line); }

      .msg { font-size: 12.5px; line-height: 1.5; }
      .msg b { font-family: var(--disp); letter-spacing: .1em; text-transform: uppercase; font-size: 10.5px; font-weight: 500; color: var(--accent); margin-right: 6px; }
      .msg.sys { color: var(--muted); font-style: italic; }
      .msg.sys b { color: var(--muted); font-style: normal; }
      .inp { border: 1px solid var(--line); background: rgb(0 0 0 / .25); border-radius: 6px; padding: 11px 14px; color: var(--muted); font-size: 13px; }

      .gridbg {
        background-image:
          linear-gradient(to right, rgb(236 239 232 / .06) 1px, transparent 1px),
          linear-gradient(to bottom, rgb(236 239 232 / .06) 1px, transparent 1px);
        background-size: 64px 64px;
      }
      .photo { position: absolute; inset: 0; overflow: hidden; }
      .photo img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) contrast(1.2) brightness(.34); }
      .photo::after { content: ''; position: absolute; inset: 0; background: hsl(150 6.5% 35%); mix-blend-mode: color; }
    </style>
  </head>
  <body>
    <header class="gal-head">
      <h1><em>#</em>footydraft — lobby screen, 20 layouts</h1>
      <p>
        Same data everywhere so the shapes are what differ: lobby FD&#8209;7K2Q, Mert hosting, Ollie
        joined, two bots added, one seat free, Auction / Top&nbsp;5 Leagues / 15s. Click any frame to
        blow it up to full 1280×800, click again to shrink it back.
      </p>
    </header>

    <div class="gal">

      <!-- ============ 01 · TEAM SHEET ============ -->
      <figure class="card">
        <div class="scaler"><div class="frame">
          <div style="position:absolute;inset:0" class="gridbg"></div>
          <div style="position:relative;height:100%;display:flex;flex-direction:column;align-items:center;padding:52px 0 0">
            <div class="row sp" style="width:720px">
              <div class="row" style="gap:8px"><span class="d" style="font-size:20px;color:var(--accent)">#</span><span class="d" style="font-size:15px">footydraft</span></div>
              <div class="row" style="gap:12px"><span class="lbl">Lobby</span><span class="code" style="font-size:16px">FD-7K2Q</span><span class="tag">Copy link</span></div>
            </div>

            <h2 class="d" style="width:720px;margin-top:44px;font-size:52px;letter-spacing:.02em;font-weight:600">Team sheet</h2>
            <p class="mut" style="width:720px;margin-top:6px;font-size:13px">Five seats. The host starts whenever the room feels right.</p>

            <div style="width:720px;margin-top:30px">
              <div class="row sp" style="padding:16px 4px;border-top:1px solid var(--line)">
                <div class="row"><span class="num mut" style="width:34px;font-size:15px">01</span><span class="av h">M</span><span class="d" style="font-size:19px">Mert</span></div>
                <div class="row" style="gap:8px"><span class="tag gold">Host</span><span class="tag">You</span></div>
              </div>
              <div class="row sp" style="padding:16px 4px;border-top:1px solid var(--line)">
                <div class="row"><span class="num mut" style="width:34px;font-size:15px">02</span><span class="av">O</span><span class="d" style="font-size:19px">Ollie</span></div>
                <span class="tag live">Ready</span>
              </div>
              <div class="row sp" style="padding:16px 4px;border-top:1px solid var(--line)">
                <div class="row"><span class="num mut" style="width:34px;font-size:15px">03</span><span class="av b">A</span><span class="d" style="font-size:19px">Ada</span></div>
                <span class="tag">Bot</span>
              </div>
              <div class="row sp" style="padding:16px 4px;border-top:1px solid var(--line)">
                <div class="row"><span class="num mut" style="width:34px;font-size:15px">04</span><span class="av b">N</span><span class="d" style="font-size:19px">Nero</span></div>
                <span class="tag">Bot</span>
              </div>
              <div class="row sp" style="padding:16px 4px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);opacity:.5">
                <div class="row"><span class="num mut" style="width:34px;font-size:15px">05</span><span class="av e">+</span><span class="d mut" style="font-size:19px">Empty seat</span></div>
                <span class="tag">Add bot</span>
              </div>
            </div>

            <div class="row sp" style="width:720px;margin-top:26px">
              <div class="row" style="gap:26px">
                <div class="col" style="gap:4px"><span class="lbl">Format</span><span class="d" style="font-size:15px">Auction</span></div>
                <div class="col" style="gap:4px"><span class="lbl">Scope</span><span class="d" style="font-size:15px">Top 5 Leagues</span></div>
                <div class="col" style="gap:4px"><span class="lbl">Timer</span><span class="d num" style="font-size:15px">15s</span></div>
                <div class="col" style="gap:4px"><span class="lbl">Constraint</span><span class="d mut" style="font-size:15px">—</span></div>
              </div>
              <div class="row" style="gap:10px"><button class="btn g sm">Edit</button><button class="btn p">Start draft</button></div>
            </div>
          </div>

          <div class="row sp" style="position:absolute;left:0;right:0;bottom:0;height:56px;padding:0 40px;border-top:1px solid var(--line);background:var(--surface)">
            <div class="row" style="gap:20px">
              <span class="lbl">Chat</span>
              <span class="msg"><b>Ollie</b>not the auction again</span>
              <span class="msg mut" style="opacity:.6"><b>Mert</b>the auction again</span>
            </div>
            <span class="tag">Type to talk ⏎</span>
          </div>
        </div></div>
        <figcaption class="cap"><b>01</b><strong>Team sheet</strong><span>One centred column, roster as ruled lines, settings as a spec row, chat flattened into a bottom bar.</span></figcaption>
      </figure>

      <!-- ============ 02 · SPLIT HALF ============ -->
      <figure class="card">
        <div class="scaler"><div class="frame">
          <div style="position:absolute;left:50%;top:0;bottom:76px;width:1px;background:var(--line)"></div>

          <div class="row sp" style="height:64px;padding:0 40px;border-bottom:1px solid var(--line)">
            <div class="row" style="gap:8px"><span class="d" style="font-size:19px;color:var(--accent)">#</span><span class="d">footydraft</span></div>
            <div class="row" style="gap:12px"><span class="lbl">Invite</span><span class="code" style="font-size:15px">FD-7K2Q</span><span class="tag gold">Copy</span></div>
          </div>

          <!-- left: who's in -->
          <div style="position:absolute;left:0;top:64px;bottom:76px;width:640px;padding:44px 48px">
            <span class="lbl">Who&rsquo;s in — 4 of 5</span>
            <div class="col" style="gap:22px;margin-top:30px">
              <div class="row" style="gap:16px"><span class="av h" style="width:52px;height:52px;font-size:19px">M</span><div class="col"><span class="d" style="font-size:27px">Mert</span><span class="lbl" style="color:var(--accent)">Host · you</span></div></div>
              <div class="row" style="gap:16px"><span class="av" style="width:52px;height:52px;font-size:19px">O</span><div class="col"><span class="d" style="font-size:27px">Ollie</span><span class="lbl">Joined 2m ago</span></div></div>
              <div class="row" style="gap:16px"><span class="av b" style="width:52px;height:52px;font-size:19px">A</span><div class="col"><span class="d" style="font-size:27px">Ada</span><span class="lbl">Bot</span></div></div>
              <div class="row" style="gap:16px"><span class="av b" style="width:52px;height:52px;font-size:19px">N</span><div class="col"><span class="d" style="font-size:27px">Nero</span><span class="lbl">Bot</span></div></div>
              <div class="row" style="gap:16px;opacity:.45"><span class="av e" style="width:52px;height:52px;font-size:19px">+</span><div class="col"><span class="d mut" style="font-size:27px">Add a bot</span><span class="lbl">One seat left</span></div></div>
            </div>
          </div>

          <!-- right: the draft -->
          <div style="position:absolute;right:0;top:64px;bottom:76px;width:640px;padding:44px 48px">
            <span class="lbl">The draft</span>
            <div class="col" style="gap:14px;margin-top:30px">
              <div class="row sp panel" style="padding:16px 18px;border-color:var(--accent)"><div class="col" style="gap:3px"><span class="lbl" style="color:var(--accent)">Format</span><span class="d" style="font-size:21px">Auction</span></div><span class="mut" style="font-size:12px;max-width:22ch;text-align:right">Bid live, blocked bids allowed</span></div>
              <div class="row sp panel" style="padding:16px 18px"><div class="col" style="gap:3px"><span class="lbl">Scope</span><span class="d" style="font-size:21px">Top 5 Leagues</span></div><span class="tag">Change</span></div>
              <div class="row sp panel" style="padding:16px 18px"><div class="col" style="gap:3px"><span class="lbl">Bid timer</span><span class="d num" style="font-size:21px">15 seconds</span></div><span class="tag">Change</span></div>
              <div class="row sp panel" style="padding:16px 18px;opacity:.45"><div class="col" style="gap:3px"><span class="lbl">Constraint</span><span class="d" style="font-size:21px">Unavailable</span></div><span class="mut" style="font-size:11.5px;max-width:20ch;text-align:right">Free Pick only</span></div>
            </div>
          </div>

          <div class="row sp" style="position:absolute;left:0;right:0;bottom:0;height:76px;padding:0 48px;border-top:1px solid var(--line)">
            <div class="row panel" style="gap:10px;padding:9px 16px;border-radius:999px"><span class="lbl">Chat</span><span class="msg">Ollie: not the auction again</span><span class="tag gold">2 new</span></div>
            <button class="btn p" style="padding:15px 44px;font-size:15px">Start draft</button>
          </div>
        </div></div>
        <figcaption class="cap"><b>02</b><strong>Split half</strong><span>People left, rules right, one hairline between them. Chat demoted to a collapsed pill so the two halves stay equal.</span></figcaption>
      </figure>

      <!-- ============ 03 · COMMAND DECK ============ -->
      <figure class="card">
        <div class="scaler"><div class="frame" style="display:grid;grid-template-columns:300px 1fr 340px">
          <!-- left rail: settings -->
          <div class="col" style="border-right:1px solid var(--line);padding:28px 24px;gap:26px;background:var(--surface)">
            <div class="row" style="gap:8px"><span class="d" style="font-size:18px;color:var(--accent)">#</span><span class="d">footydraft</span></div>
            <div class="col" style="gap:9px"><span class="lbl">Format</span>
              <div class="d panel" style="padding:11px 13px;font-size:13px;border-color:var(--accent);color:var(--accent)">Auction</div>
              <div class="d" style="padding:11px 13px;font-size:13px;color:var(--muted)">Deal or No Deal</div>
              <div class="d" style="padding:11px 13px;font-size:13px;color:var(--muted)">Free Pick</div>
              <div class="d" style="padding:11px 13px;font-size:13px;color:var(--muted)">Spin the Wheel</div>
            </div>
            <div class="col" style="gap:9px"><span class="lbl">Scope</span>
              <div class="d panel" style="padding:11px 13px;font-size:13px;border-color:var(--accent);color:var(--accent)">Top 5 Leagues</div>
              <div class="d" style="padding:11px 13px;font-size:13px;color:var(--muted)">All players</div>
              <div class="d" style="padding:11px 13px;font-size:13px;color:var(--muted)">One league…</div>
              <div class="d" style="padding:11px 13px;font-size:13px;color:var(--muted)">One nation…</div>
            </div>
            <div class="col" style="gap:9px"><span class="lbl">Bid timer</span><div class="seg"><span class="on">15s</span><span>30s</span><span>Off</span></div></div>
          </div>

          <!-- centre: the room -->
          <div class="col" style="padding:40px;gap:0;position:relative">
            <div class="row sp"><span class="lbl">Lobby</span><div class="row" style="gap:10px"><span class="code" style="font-size:20px">FD-7K2Q</span><span class="tag gold">Copy invite</span></div></div>
            <h2 class="d" style="font-size:40px;margin-top:26px">Four in the room</h2>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:24px">
              <div class="panel col" style="padding:18px;gap:12px;border-color:var(--accent)"><span class="av h" style="width:48px;height:48px;font-size:18px">M</span><div class="col" style="gap:2px"><span class="d" style="font-size:19px">Mert</span><span class="lbl" style="color:var(--accent)">Host · you</span></div></div>
              <div class="panel col" style="padding:18px;gap:12px"><span class="av" style="width:48px;height:48px;font-size:18px">O</span><div class="col" style="gap:2px"><span class="d" style="font-size:19px">Ollie</span><span class="lbl">Ready</span></div></div>
              <div class="panel col" style="padding:18px;gap:12px"><span class="av b" style="width:48px;height:48px;font-size:18px">A</span><div class="col" style="gap:2px"><span class="d" style="font-size:19px">Ada</span><span class="lbl">Bot</span></div></div>
              <div class="panel col" style="padding:18px;gap:12px"><span class="av b" style="width:48px;height:48px;font-size:18px">N</span><div class="col" style="gap:2px"><span class="d" style="font-size:19px">Nero</span><span class="lbl">Bot</span></div></div>
              <div class="col" style="padding:18px;gap:12px;border:1px dashed var(--line);opacity:.55"><span class="av e" style="width:48px;height:48px;font-size:18px">+</span><div class="col" style="gap:2px"><span class="d mut" style="font-size:19px">Add bot</span><span class="lbl">1 seat left</span></div></div>
            </div>
            <div class="row" style="margin-top:auto;gap:14px"><button class="btn p" style="flex:1;padding:17px">Start draft</button><button class="btn g">Leave</button></div>
          </div>

          <!-- right: chat -->
          <div class="col" style="border-left:1px solid var(--line);background:var(--surface)">
            <div class="row sp" style="padding:20px 20px 14px;border-bottom:1px solid var(--line)"><span class="lbl">Lobby chat</span><span class="tag live">Live</span></div>
            <div class="col" style="gap:14px;padding:18px 20px;flex:1">
              <p class="msg sys"><b>—</b>Ollie joined the lobby</p>
              <p class="msg"><b>Ollie</b>not the auction again</p>
              <p class="msg"><b>Mert</b>the auction again</p>
              <p class="msg sys"><b>—</b>Mert added Ada and Nero</p>
              <p class="msg"><b>Ollie</b>fine but i&rsquo;m taking every keeper out of spite</p>
            </div>
            <div class="inp" style="margin:0 20px 20px">Say something…</div>
          </div>
        </div></div>
        <figcaption class="cap"><b>03</b><strong>Command deck</strong><span>Three permanent columns: settings rail, room in the middle, full-height chat. Nothing is ever hidden.</span></figcaption>
      </figure>

      <!-- ============ 04 · DEPARTURE BOARD ============ -->
      <figure class="card">
        <div class="scaler"><div class="frame">
          <div class="row sp" style="height:88px;padding:0 44px;border-bottom:2px solid var(--accent);background:var(--surface)">
            <div class="col" style="gap:4px"><span class="lbl">Departures</span><span class="d" style="font-size:26px">Gate <span style="color:var(--accent)">FD-7K2Q</span></span></div>
            <div class="row" style="gap:44px">
              <div class="col" style="gap:4px"><span class="lbl">Format</span><span class="d num" style="font-size:22px">Auction</span></div>
              <div class="col" style="gap:4px"><span class="lbl">Scope</span><span class="d num" style="font-size:22px">Top 5</span></div>
              <div class="col" style="gap:4px"><span class="lbl">Clock</span><span class="d num" style="font-size:22px;color:var(--accent)">15s</span></div>
            </div>
          </div>

          <div style="padding:34px 44px 0">
            <div class="row" style="padding-bottom:12px;border-bottom:1px solid var(--line)">
              <span class="lbl" style="width:70px">Seat</span><span class="lbl" style="flex:1">Passenger</span><span class="lbl" style="width:150px">Type</span><span class="lbl" style="width:170px">Status</span>
            </div>
            <div class="row" style="padding:19px 0;border-bottom:1px solid var(--line)"><span class="num" style="width:70px;font-size:22px;color:var(--accent)">01</span><span class="d" style="flex:1;font-size:26px">Mert</span><span class="d mut" style="width:150px;font-size:14px">Human · host</span><span class="d" style="width:170px;font-size:18px;color:var(--live)">Boarded</span></div>
            <div class="row" style="padding:19px 0;border-bottom:1px solid var(--line)"><span class="num" style="width:70px;font-size:22px;color:var(--accent)">02</span><span class="d" style="flex:1;font-size:26px">Ollie</span><span class="d mut" style="width:150px;font-size:14px">Human</span><span class="d" style="width:170px;font-size:18px;color:var(--live)">Boarded</span></div>

              <div class="row sp" style="padding:18px 0"><span class="mut" style="font-size:13px">bid clock</span><span class="d num" style="font-size:24px">15 seconds</span></div>
              <div class="row sp" style="padding:18px 0;opacity:.4"><span class="mut" style="font-size:13px">constraint</span><span class="d" style="font-size:24px">Free Pick only</span></div>
              <div class="row sp" style="padding:18px 0"><span class="mut" style="font-size:13px">privacy</span><span class="d" style="font-size:24px">Link only</span></div>
            </div>
          </div>

          <div class="col" style="margin-top:64px;gap:0">
            <div class="row sp" style="padding-bottom:12px;border-bottom:1px solid var(--line)"><span class="lbl">Chat</span><span class="lbl">4 online</span></div>
            <div class="row" style="gap:36px;padding:18px 0">
              <span class="msg" style="font-size:14px"><b>Ollie</b>not the auction again</span>
              <span class="msg" style="font-size:14px"><b>Mert</b>the auction again</span>
              <span class="msg sys" style="font-size:14px">Ada and Nero were added</span>
            </div>
            <div class="row sp" style="padding:10px 0;border-top:1px solid var(--line)"><span class="mut" style="font-size:13.5px">Say something…</span><span class="lbl">⏎</span></div>
          </div>

          <div class="row sp" style="position:absolute;left:80px;right:80px;bottom:56px;align-items:flex-end">
            <span class="mut" style="font-size:12.5px;max-width:44ch;line-height:1.6">Everything here is a line of text. No panels, no cards, no fills — the only filled thing on the screen is the one button that matters.</span>
            <button class="btn p" style="padding:18px 52px;font-size:16px">Start draft</button>
          </div>
        </div></div>
        <figcaption class="cap"><b>19</b><strong>Hairline</strong><span>Extreme restraint: type on a baseline grid, hairlines instead of panels, one filled element on the whole screen.</span></figcaption>
      </figure>

      <!-- ============ 20 · GLASS CORNERS ============ -->
      <figure class="card">
        <div class="scaler"><div class="frame">
          <div class="photo"><img src="../public/stadium.webp" alt="" /></div>
          <div style="position:absolute;inset:0;background:radial-gradient(ellipse at center,rgb(16 22 19 / .25),rgb(16 22 19 / .86))"></div>

          <div class="col" style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);align-items:center;gap:16px">
            <span class="lbl">Waiting on the host</span>
            <div class="row" style="gap:14px"><span class="code" style="font-size:70px;font-weight:600">FD</span><span class="code" style="font-size:70px;font-weight:600;color:var(--accent)">7K2Q</span></div>
            <button class="btn p" style="padding:20px 60px;font-size:18px;box-shadow:10px 10px 0 rgb(0 0 0 / .4)">Start draft</button>
            <span class="mut" style="font-size:12.5px">4 drafters · Auction · Top 5 Leagues · 15s</span>
          </div>

          <!-- TL: drafters -->
          <div class="col" style="position:absolute;left:32px;top:32px;width:300px;padding:20px;gap:12px;background:rgb(24 32 25 / .72);backdrop-filter:blur(10px);border:1px solid rgb(42 52 44 / .9)">
            <div class="row sp"><span class="lbl">Drafters</span><span class="d num" style="font-size:13px;color:var(--accent)">4/5</span></div>
            <div class="row" style="gap:10px"><span class="av h" style="width:32px;height:32px;font-size:12px">M</span><span class="d" style="font-size:15px;flex:1">Mert</span><span class="tag gold">Host</span></div>
            <div class="row" style="gap:10px"><span class="av" style="width:32px;height:32px;font-size:12px">O</span><span class="d" style="font-size:15px;flex:1">Ollie</span><span class="tag live">Ready</span></div>
            <div class="row" style="gap:10px"><span class="av b" style="width:32px;height:32px;font-size:12px">A</span><span class="d" style="font-size:15px;flex:1">Ada</span><span class="tag">Bot</span></div>
            <div class="row" style="gap:10px"><span class="av b" style="width:32px;height:32px;font-size:12px">N</span><span class="d" style="font-size:15px;flex:1">Nero</span><span class="tag">Bot</span></div>
            <div class="row" style="gap:10px;opacity:.5"><span class="av e" style="width:32px;height:32px;font-size:12px">+</span><span class="d mut" style="font-size:15px;flex:1">Add bot</span></div>
          </div>

          <!-- TR: setup -->
          <div class="col" style="position:absolute;right:32px;top:32px;width:300px;padding:20px;gap:12px;background:rgb(24 32 25 / .72);backdrop-filter:blur(10px);border:1px solid rgb(42 52 44 / .9)">
            <div class="row sp"><span class="lbl">Setup</span><span class="tag gold">Host only</span></div>
            <div class="row sp"><span class="mut" style="font-size:12.5px">Format</span><span class="d" style="font-size:15px;color:var(--accent)">Auction</span></div>
            <div class="row sp"><span class="mut" style="font-size:12.5px">Scope</span><span class="d" style="font-size:15px">Top 5 Leagues</span></div>
            <div class="row sp"><span class="mut" style="font-size:12.5px">Bid clock</span><span class="d num" style="font-size:15px">15s</span></div>
            <div class="row sp" style="opacity:.45"><span class="mut" style="font-size:12.5px">Constraint</span><span class="d" style="font-size:15px">Free Pick only</span></div>
            <button class="btn g sm" style="margin-top:4px">Change setup</button>
          </div>

          <!-- BL: chat -->
          <div class="col" style="position:absolute;left:32px;bottom:32px;width:360px;padding:20px;gap:11px;background:rgb(24 32 25 / .72);backdrop-filter:blur(10px);border:1px solid rgb(42 52 44 / .9)">
            <div class="row sp"><span class="lbl">Chat</span><span class="tag live">Live</span></div>
            <p class="msg"><b>Ollie</b>not the auction again</p>
            <p class="msg"><b>Mert</b>the auction again</p>
            <p class="msg"><b>Ollie</b>i&rsquo;m taking every keeper out of spite</p>
            <div class="inp" style="margin-top:2px">Say something…</div>
          </div>

          <!-- BR: invite -->
          <div class="col" style="position:absolute;right:32px;bottom:32px;width:300px;padding:20px;gap:10px;background:rgb(24 32 25 / .72);backdrop-filter:blur(10px);border:1px solid rgb(42 52 44 / .9)">
            <span class="lbl">Invite</span>
            <span class="mut" style="font-size:13px">footydraft.gg/j/7K2Q</span>
            <div class="row" style="gap:10px"><button class="btn g sm" style="flex:1">Copy link</button><button class="btn g sm" style="flex:1">Add bot</button></div>
            <span class="mut" style="font-size:11.5px;line-height:1.5">Link-only. There&rsquo;s no public list of lobbies.</span>
          </div>
        </div></div>
        <figcaption class="cap"><b>20</b><strong>Glass corners</strong><span>The stadium is the room; UI floats in four glass corners with the invite code dead centre. Most atmospheric, least dense.</span></figcaption>
      </figure>

    </div>

    <script>
      document.querySelectorAll('.scaler').forEach((s) =>
        s.addEventListener('click', () => {
          s.closest('.card').classList.toggle('zoom')
          s.closest('.card').scrollIntoView({ behavior: 'smooth', block: 'nearest' })
        })
      )
    </script>
  </body>
</html>
