<!doctype html>
<meta charset="utf-8">
<title>Logo centre picker</title>
<style>
  body { background:#222; color:#eee; font:13px monospace; margin:20px; }
  .row { display:flex; gap:40px; align-items:flex-start; }
  .box { position:relative; display:inline-block; background:#111; border:1px solid #555; }
  .box img { display:block; height:420px; width:auto; }
  .dot { position:absolute; width:9px; height:9px; margin:-5px 0 0 -5px; border-radius:50%;
         background:#ef7a3c; border:1px solid #fff; pointer-events:none; }
  .mid { position:absolute; left:0; right:0; top:50%; height:1px; background:#0af; pointer-events:none; }
  pre { background:#111; border:1px solid #555; padding:10px; white-space:pre-wrap; }
</style>

<p>Click the visual centre of each mark. Blue line = current geometric centre.</p>

<div class="row">
  <div>
    <div class="box" data-name="serie-a">
      <img src="../public/leagues/serie-a.svg" alt="">
      <div class="mid"></div>
    </div>
    <div>serie-a</div>
  </div>
  <div>
    <div class="box" data-name="ligue-1">
      <img src="../public/leagues/ligue-1.svg" alt="">
      <div class="mid"></div>
    </div>
    <div>ligue-1</div>
  </div>
</div>

<pre id="out">click a logo…</pre>

<script>
const out = document.getElementById('out');
const results = {};

document.querySelectorAll('.box').forEach(box => {
  box.addEventListener('click', e => {
    const r = box.getBoundingClientRect();
    const fx = (e.clientX - r.left) / r.width;
    const fy = (e.clientY - r.top) / r.height;

    box.querySelectorAll('.dot').forEach(d => d.remove());
    const dot = document.createElement('div');
    dot.className = 'dot';
    dot.style.left = (fx * 100) + '%';
    dot.style.top = (fy * 100) + '%';
    box.appendChild(dot);

    results[box.dataset.name] = { fx, fy };

    out.textContent = Object.entries(results).map(([name, v]) =>
      name + '\n' +
      '  clicked centre : x ' + (v.fx * 100).toFixed(2) + '%   y ' + (v.fy * 100).toFixed(2) + '%\n' +
      '  offset from 50%: x ' + ((v.fx - .5) * 100).toFixed(2) + '%   y ' + ((v.fy - .5) * 100).toFixed(2) + '%\n'
    ).join('\n');
  });
});
</script>
