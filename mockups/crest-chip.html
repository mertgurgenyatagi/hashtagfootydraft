<!doctype html>
<meta charset="utf-8">
<title>Crest chip test</title>
<style>
  body { background:#071414; color:#e2f0ee; font:13px monospace; margin:20px; }
  h2 { font-size:13px; font-weight:normal; color:#8fa; margin:24px 0 8px; }

  /* --- exactly what the lobby ships, with the vars resolved at 1280x800 --- */
  .chip {
    display:grid;
    place-items:center;
    height:43.2px;              /* --lobby-crest: clamp(2.25rem,5.4vh,3rem) */
    width:52px;                 /* clamp(2rem,5vw,3.25rem) */
    border:1px solid #1e3a3a;
    border-radius:2px;
    box-sizing:border-box;
  }
  .chip img {
    height:64%;
    width:64%;
    object-fit:contain;
    filter: drop-shadow(0 1px 0 #e2f0ee) drop-shadow(0 -1px 0 #e2f0ee)
            drop-shadow(1px 0 0 #e2f0ee) drop-shadow(-1px 0 0 #e2f0ee);
  }

  /* THE FIX: a grid item's automatic minimum size (min-height:auto) can clamp a
     replaced element's height UP past an explicit percentage, using its
     intrinsic aspect ratio. Only bites portrait marks, which is why exactly
     serie-a and ligue-1 broke. */
  .fixed .chip img { min-width:0; min-height:0; }

  .row { display:flex; gap:8px; align-items:center; }

  /* magnified copy — same layout, just scaled, so nothing about it changes */
  .mag { transform:scale(6); transform-origin:top left; }
  .magwrap { height:300px; }

  /* boxes drawn so overflow is obvious */
  .show .chip { outline:1px solid #ef7a3c; outline-offset:0; }
  .show .chip img { outline:1px solid #0af; }

  pre { background:#0d1f1f; border:1px solid #1e3a3a; padding:10px; }
</style>

<p>Orange = the chip (button) box. Blue = the &lt;img&gt; box. If a mark is clipped,
the blue box will sit outside the orange one.</p>

<h2>real size</h2>
<div class="row show">
  <span class="chip"><img src="../public/leagues/premier-league.svg" alt=""></span>
  <span class="chip"><img src="../public/leagues/la-liga.svg" alt=""></span>
  <span class="chip"><img src="../public/leagues/serie-a.svg" alt=""></span>
  <span class="chip"><img src="../public/leagues/bundesliga.svg" alt=""></span>
  <span class="chip"><img src="../public/leagues/ligue-1.svg" alt=""></span>
</div>

<h2>6× — BEFORE (as shipped)</h2>
<div class="magwrap">
  <div class="row show mag">
    <span class="chip"><img src="../public/leagues/premier-league.svg" alt=""></span>
    <span class="chip"><img src="../public/leagues/la-liga.svg" alt=""></span>
    <span class="chip"><img src="../public/leagues/serie-a.svg" alt=""></span>
    <span class="chip"><img src="../public/leagues/bundesliga.svg" alt=""></span>
    <span class="chip"><img src="../public/leagues/ligue-1.svg" alt=""></span>
  </div>
</div>

<h2>6× — AFTER (min-width:0; min-height:0 on the mark)</h2>
<div class="magwrap">
  <div class="row show mag fixed">
    <span class="chip"><img src="../public/leagues/premier-league.svg" alt=""></span>
    <span class="chip"><img src="../public/leagues/la-liga.svg" alt=""></span>
    <span class="chip"><img src="../public/leagues/serie-a.svg" alt=""></span>
    <span class="chip"><img src="../public/leagues/bundesliga.svg" alt=""></span>
    <span class="chip"><img src="../public/leagues/ligue-1.svg" alt=""></span>
  </div>
</div>

<h2>real size — AFTER</h2>
<div class="row show fixed">
  <span class="chip"><img src="../public/leagues/premier-league.svg" alt=""></span>
  <span class="chip"><img src="../public/leagues/la-liga.svg" alt=""></span>
  <span class="chip"><img src="../public/leagues/serie-a.svg" alt=""></span>
  <span class="chip"><img src="../public/leagues/bundesliga.svg" alt=""></span>
  <span class="chip"><img src="../public/leagues/ligue-1.svg" alt=""></span>
</div>

<h2>measured</h2>
<pre id="out">…</pre>

<script>
const names = ['premier-league','la-liga','serie-a','bundesliga','ligue-1'];

function report(rowSelector, title) {
  const chips = document.querySelectorAll(rowSelector + ' .chip');
  let s = title + '\n';
  chips.forEach((chip, i) => {
    const img = chip.querySelector('img');
    const c = chip.getBoundingClientRect();
    const r = img.getBoundingClientRect();
    const overTop = c.top - r.top, overBottom = r.bottom - c.bottom;
    const bad = overTop > 0.01 || overBottom > 0.01;
    s += '  ' + names[i].padEnd(16) +
      'img ' + r.width.toFixed(2).padStart(6) + ' x ' + r.height.toFixed(2).padStart(6) +
      '   overflow top ' + overTop.toFixed(2).padStart(7) +
      ' bottom ' + overBottom.toFixed(2).padStart(7) +
      (bad ? '   <-- OVERFLOWS' : '   ok') + '\n';
  });
  return s;
}

addEventListener('load', () => {
  const chip = document.querySelector('.row .chip').getBoundingClientRect();
  document.getElementById('out').textContent =
    'chip box: ' + chip.width.toFixed(2) + ' x ' + chip.height.toFixed(2) +
    '   (64% of the 41.2px content box = 26.37px is the intended mark height)\n\n' +
    report('.row.show:not(.mag):not(.fixed)', 'BEFORE') + '\n' +
    report('.row.show:not(.mag).fixed', 'AFTER');
});
</script>
